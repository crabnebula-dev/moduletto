[package]
name = "moduletto"
version = "0.1.0"
edition = "2021"
authors = ["Daniel Thompson-Yvetot"]
license = "MIT OR Apache-2.0"
description = "Optimized modular arithmetic and NTT for lattice cryptography — i64 scalar, i16 NEON, and Kyber KEM"
keywords = ["modular", "ntt", "kyber", "cryptography", "performance"]
categories = ["mathematics", "no-std", "cryptography", "embedded"]
repository = "https://github.com/crabnebula-dev/moduletto"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
# Constant-time primitives with inline asm barrier (side-channel hardening)
subtle = { version = "2.6", default-features = false, features = ["core_hint_black_box"] }

# Wipes secret key material and the intermediates of key generation,
# encapsulation and decapsulation (src/kem.rs)
zeroize = { version = "1.8", default-features = false }

# Optional OS randomness for `kem::*::keygen()` and `kem::*::encaps(ek)`
getrandom = { version = "0.4", optional = true }

# Optional WebAssembly support
wasm-bindgen = { version = "0.2", optional = true }
web-sys = { version = "0.3", features = ["Window", "Performance"], optional = true }

# Math functions for no_std environments
libm = { version = "0.2", optional = true }

[dev-dependencies]
# rayon is a default criterion feature used only for bootstrap resampling in
# post-run analysis (it has a serial fallback). Dropping it removes
# rayon -> rayon-core -> crossbeam-deque -> crossbeam-epoch from the tree.
criterion = { version = "0.8", default-features = false, features = ["plotters", "cargo_bench_support"] }
sha3 = { version = "0.10", features = ["asm"] }
aes-gcm = "0.10"
dudect-bencher = "0.7"

[features]
default = ["std"]
std = ["alloc"]
alloc = ["libm"]
wasm = ["wasm-bindgen", "web-sys"]
# RNG-backed `keygen()` / `encaps(ek)` in `kem`, drawing from the OS CSPRNG
getrandom = ["dep:getrandom", "std"]
# Valgrind memcheck hooks for the ctgrind-style constant-time check
# (`examples/valgrind_ct.rs`); no-ops off x86-64 Linux. Not for production.
valgrind-ct = ["std"]

[profile.dev]
panic = "abort"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"

[[example]]
name = "kyber_benchmark"
path = "examples/kyber_benchmark.rs"
required-features = ["std"]

[[example]]
name = "no_std_embedded"
path = "examples/no_std_embedded.rs"

[[example]]
name = "bench_no_std"
path = "examples/bench_no_std.rs"

[[example]]
name = "wasm_usage"
path = "examples/wasm_usage.rs"
required-features = ["std"]

[[example]]
name = "hybrid_pq_aes"
path = "examples/hybrid_pq_aes.rs"
required-features = ["std"]

[[example]]
name = "bench_wasm"
path = "examples/bench_wasm.rs"

[[example]]
name = "ct_dudect"
path = "examples/ct_dudect.rs"
required-features = ["std"]

[[example]]
name = "valgrind_ct"
path = "examples/valgrind_ct.rs"
required-features = ["std", "valgrind-ct"]

[[bench]]
name = "moduletto_bench"
harness = false

# Enable all features for docs.rs
[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

# WASM build configuration - optimize for size
[package.metadata.wasm-pack.profile.release]
wasm-opt = ["-Oz", "--enable-bulk-memory", "--enable-nontrapping-float-to-int", "--enable-sign-ext", "--enable-mutable-globals"]
