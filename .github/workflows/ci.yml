name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    # x86-64 runs the scalar int16 path; macOS arm64 runs the NEON path.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Tests, including the NIST ACVP ML-KEM vectors
        run: cargo test --release
      # The crate is also a cdylib (wasm), so check no_std as an rlib.
      - name: no_std builds
        run: |
          cargo rustc --lib --crate-type rlib --no-default-features
          cargo rustc --lib --crate-type rlib --no-default-features --features alloc
