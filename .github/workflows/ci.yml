name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

# Actions are pinned to commit SHAs; Dependabot (.github/dependabot.yml)
# proposes updates.
jobs:
  test:
    # x86-64 runs the scalar int16 path; macOS arm64 runs the NEON path.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # stable
        with:
          toolchain: stable
          components: rustfmt, clippy
      - name: Formatting
        run: cargo fmt --check
      - name: Clippy, warnings denied
        run: |
          cargo clippy --all-targets -- -D warnings
          cargo clippy --all-targets --features getrandom -- -D warnings
          # examples/ct_dudect.rs needs the bench-only ct-bench feature.
          cargo clippy --all-targets --features ct-bench -- -D warnings
      - name: Tests, including the NIST ACVP ML-KEM and ML-DSA vectors (release)
        run: cargo test --release
      - name: Tests with overflow checks (debug)
        run: cargo test
      - name: Tests with the getrandom feature
        run: cargo test --release --features getrandom
      # The crate is also a cdylib (wasm), so check no_std as an rlib.
      - name: no_std builds
        run: |
          cargo rustc --lib --crate-type rlib --no-default-features
          cargo rustc --lib --crate-type rlib --no-default-features --features alloc
      - name: Examples build
        run: |
          cargo build --release --examples
          cargo build --release --features ct-bench --example ct_dudect

  constant-time:
    # Two complementary checks of the secret-dependent paths; see
    # audits/README.md, "Timing verification".
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # stable
        with:
          toolchain: stable
      - name: Valgrind, ctgrind-style (secrets undefined, no dependent branch or lookup)
        run: |
          sudo apt-get update -q && sudo apt-get install -y -q valgrind
          cargo build --release --features valgrind-ct --example valgrind_ct
          valgrind --tool=memcheck --error-exitcode=1 -q \
            target/release/examples/valgrind_ct
      - name: dudect statistical timing test
        # Fails if any benchmark's |max t| exceeds the dudect paper's 4.5
        # threshold by a margin that shared-runner noise does not produce:
        # the classes are interleaved at random, so noise lands on both.
        run: |
          # The default shell is bash -e without pipefail, so a build failure
          # or a panic (abort) in ct_dudect would otherwise leave tee's 0.
          set -o pipefail
          cargo run --release --features ct-bench --example ct_dudect | tee dudect.log
          # hw_mul64_zero_vs_random measures the CPU with DIT clear and is
          # expected to report a difference; it is not part of the gate.
          # The gate also fails unless all 11 benches reported exactly once
          # (10 gated, 1 not) and the run printed its completion line. Update
          # the counts when a bench is added; never to drop one.
          awk '/max t =/ {
                 name = $2
                 if (name == "hw_mul64_zero_vs_random") { ungated++; next }
                 if (!(name in seen)) distinct++; seen[name] = 1; gated++
                 match($0, /max t = [-+][0-9.]+/); t = substr($0, RSTART + 8, RLENGTH - 8) + 0;
                 if (t < 0) t = -t; if (t > worst) worst = t }
               /^dudect benches complete/ { done = 1 }
               END { printf "gated benches = %d (distinct %d), ungated = %d, complete = %d\n", gated, distinct, ungated, done
                     printf "worst gated |t| = %.3f\n", worst
                     exit (worst > 10 || gated != 10 || distinct != 10 || ungated != 1 || !done) }' dudect.log

  fuzz:
    # Builds every fuzz target and runs the ML-DSA ones (signature and key
    # decoding, sign-then-verify round trips) for 30 seconds each. macOS
    # arm64 covers the AArch64-only paths (two-lane SHA3 sampling, DIT).
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # stable
        with:
          toolchain: nightly-2026-10-24
      - name: Install cargo-fuzz
        run: cargo install cargo-fuzz --locked
      - name: Build the fuzz targets
        run: cargo +nightly-2026-10-24 fuzz build
      - name: Run the ML-DSA fuzz targets
        run: |
          for target in fuzz_dsa_sig_decode fuzz_dsa_key_decode fuzz_dsa_roundtrip; do
            cargo +nightly-2026-10-24 fuzz run "$target" -- -max_total_time=30
          done

  proofs:
    # Rocq type-checks the four proof files; the OCaml harness runs its checks.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: coq-community/docker-coq-action@126d4ac196f8133729a1cb0d2aa1ee7106efec58 # v1.5.2
        with:
          custom_image: rocq/rocq-prover:9.1.1-ocaml-4.14.2-flambda
          custom_script: |
            startGroup "Rocq proofs and OCaml harness"
              sudo chown -R "$(id -u):$(id -g)" proofs
              make -C proofs all
            endGroup

  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # stable
        with:
          toolchain: stable
      - name: Known-vulnerability audit of Cargo.lock
        run: |
          cargo install cargo-audit --locked
          cargo audit
